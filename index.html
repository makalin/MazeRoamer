<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MazeRoamer - Maze Game Generator</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #controls { position: absolute; top: 10px; left: 10px; }
    </style>
</head>
<body>
    <div id="controls">
        <button id="newMaze">New Maze</button>
        <button id="toggleView">Switch to 2D/3D</button>
        <select id="themeSelect">
    <option value="default">Default</option>
    <option value="doom">Doom</option>
    <option value="neon">Neon</option>
    <option value="forest">Forest</option>
    <option value="lava">Lava</option>
    <option value="cyber">Cyber</option>
    <option value="twilight">Twilight</option>
        </select>
        <div>Time: <span id="timer">0</span>s</div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
        // Maze generation
        const width = 10, height = 10;
        let maze = [];
        function generateMaze() {
            maze = Array(height).fill().map(() => Array(width).fill(1));
            function carve(x, y) {
                maze[y][x] = 0;
                const directions = [[0, 2], [2, 0], [0, -2], [-2, 0]];
                directions.sort(() => Math.random() - 0.5);
                for (let [dx, dy] of directions) {
                    const nx = x + dx, ny = y + dy;
                    if (nx >= 0 && nx < width && ny >= 0 && ny < height && maze[ny][nx] === 1) {
                        maze[y + dy/2][x + dx/2] = 0;
                        carve(nx, ny);
                    }
                }
            }
            carve(0, 0);
            maze[0][0] = 0; // Start
            maze[height-1][width-1] = 0; // End
            return maze;
        }

        // Three.js setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        let is3D = true;
        camera.position.set(0, 20, 0);
        camera.lookAt(0, 0, 0);

        // Themes
        const themes = {
    default: {
        wallColors: [0x4a90e2, 0x9b59b6], // Blue to purple
        floorColor: 0x808080,              // Medium gray
        background: 0x000000               // Black
    },
    doom: {
        wallColors: [0x2f2f2f, 0x8b0000], // Dark gray to dark red
        floorColor: 0x1a1a1a,              // Near-black
        background: 0x111111               // Dark gray
    },
    neon: {
        wallColors: [0x00ffff, 0xff00ff], // Cyan to magenta
        floorColor: 0x1c2526,              // Dark teal
        background: 0x0a0f14              // Deep blue-black
    },
    forest: {
        wallColors: [0x2e8b57, 0x8fbc8f], // Sea green to light green
        floorColor: 0x3c2f2f,              // Dark brown
        background: 0x1a2f1a              // Deep forest green
    },
    lava: {
        wallColors: [0xff4500, 0xffff00], // Orange-red to yellow
        floorColor: 0x2c1b18,              // Dark reddish-brown
        background: 0x1a0000              // Deep red-black
    },
    cyber: {
        wallColors: [0x00b7eb, 0xff073a], // Sky blue to neon red
        floorColor: 0x2a2a2a,              // Dark gray
        background: 0x0d1b2a              // Dark blue-gray
    },
    twilight: {
        wallColors: [0x483d8b, 0xffa500], // Dark slate blue to orange
        floorColor: 0x2f2f4f,              // Muted purple-gray
        background: 0x191970              // Midnight blue
    }
};
        let currentTheme = 'default';

        // Gradient shader for walls
        const wallShader = {
            uniforms: {
                color1: { value: new THREE.Color(themes[currentTheme].wallColors[0]) },
                color2: { value: new THREE.Color(themes[currentTheme].wallColors[1]) }
            },
            vertexShader: `
                varying vec3 vPosition;
                void main() {
                    vPosition = position;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 color1;
                uniform vec3 color2;
                varying vec3 vPosition;
                void main() {
                    float mixValue = (vPosition.y + 0.5) / 1.0;
                    vec3 color = mix(color1, color2, mixValue);
                    gl_FragColor = vec4(color, 1.0);
                }
            `
        };

        // Build maze
        let mazeObjects = [];
        function buildMaze() {
            mazeObjects.forEach(obj => scene.remove(obj));
            mazeObjects = [];
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const wallMaterial = new THREE.ShaderMaterial({
                uniforms: wallShader.uniforms,
                vertexShader: wallShader.vertexShader,
                fragmentShader: wallShader.fragmentShader
            });
            const floorMaterial = new THREE.MeshBasicMaterial({ color: themes[currentTheme].floorColor });
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    if (maze[y][x] === 1) {
                        const wall = new THREE.Mesh(geometry, wallMaterial);
                        wall.position.set(x - width/2 + 0.5, 0.5, y - height/2 + 0.5);
                        scene.add(wall);
                        mazeObjects.push(wall);
                    } else {
                        const floor = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), floorMaterial);
                        floor.rotation.x = -Math.PI / 2;
                        floor.position.set(x - width/2 + 0.5, 0, y - height/2 + 0.5);
                        scene.add(floor);
                        mazeObjects.push(floor);
                    }
                }
            }
            scene.background = new THREE.Color(themes[currentTheme].background);
        }

        // Character (simple humanoid)
        const character = new THREE.Group();
        const bodyGeometry = new THREE.CylinderGeometry(0.3, 0.3, 1, 32);
        const headGeometry = new THREE.SphereGeometry(0.2, 32, 32);
        const characterMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const body = new THREE.Mesh(bodyGeometry, characterMaterial);
        const head = new THREE.Mesh(headGeometry, characterMaterial);
        body.position.y = 0.5;
        head.position.y = 1.2;
        character.add(body);
        character.add(head);
        character.position.set(-width/2 + 0.5, 0, -height/2 + 0.5);
        scene.add(character);

        // Smooth movement
        const moveSpeed = 0.05;
        let targetPosition = character.position.clone();
        const keys = { up: false, down: false, left: false, right: false };
        document.addEventListener('keydown', (event) => {
            switch (event.key) {
                case 'ArrowUp': case 'w': keys.up = true; break;
                case 'ArrowDown': case 's': keys.down = true; break;
                case 'ArrowLeft': case 'a': keys.left = true; break;
                case 'ArrowRight': case 'd': keys.right = true; break;
            }
        });
        document.addEventListener('keyup', (event) => {
            switch (event.key) {
                case 'ArrowUp': case 'w': keys.up = false; break;
                case 'ArrowDown': case 's': keys.down = false; break;
                case 'ArrowLeft': case 'a': keys.left = false; break;
                case 'ArrowRight': case 'd': keys.right = false; break;
            }
        });

        function updateMovement() {
            let dx = 0, dz = 0;
            if (keys.up) dz -= moveSpeed;
            if (keys.down) dz += moveSpeed;
            if (keys.left) dx -= moveSpeed;
            if (keys.right) dx += moveSpeed;

            if (dx !== 0 || dz !== 0) {
                const newX = targetPosition.x + dx;
                const newZ = targetPosition.z + dz;
                const mazeX = Math.floor(newX + width/2);
                const mazeZ = Math.floor(newZ + height/2);
                if (mazeX >= 0 && mazeX < width && mazeZ >= 0 && mazeZ < height && maze[mazeZ][mazeX] === 0) {
                    targetPosition.set(newX, 0, newZ);
                }
            }
            character.position.lerp(targetPosition, 0.1); // Smooth interpolation
            if (is3D) {
                camera.position.set(character.position.x, 2, character.position.z - 2);
            }
        }

        // Timer
        let time = 0;
        setInterval(() => {
            time += 1;
            document.getElementById('timer').textContent = time;
        }, 1000);

        // Controls
        document.getElementById('newMaze').addEventListener('click', () => {
            generateMaze();
            buildMaze();
            character.position.set(-width/2 + 0.5, 0, -height/2 + 0.5);
            targetPosition.copy(character.position);
            time = 0;
        });

        document.getElementById('toggleView').addEventListener('click', () => {
            is3D = !is3D;
            if (is3D) {
                camera.position.set(character.position.x, 2, character.position.z - 2);
                camera.lookAt(character.position);
            } else {
                camera.position.set(0, 20, 0);
                camera.lookAt(0, 0, 0);
            }
        });

        document.getElementById('themeSelect').addEventListener('change', (event) => {
            currentTheme = event.target.value;
            wallShader.uniforms.color1.value.setHex(themes[currentTheme].wallColors[0]);
            wallShader.uniforms.color2.value.setHex(themes[currentTheme].wallColors[1]);
            buildMaze();
        });

        // Initial setup
        generateMaze();
        buildMaze();

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            updateMovement();
            if (is3D) camera.lookAt(character.position);
            renderer.render(scene, camera);
        }
        animate();

        // Resize handling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
